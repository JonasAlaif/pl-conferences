name: Model probe (temporary diagnostic)

# Runs Gemma 4 26B-A4B QAT (from this repository's model release) with
# llama.cpp's server on fresh runners, CPU only, on three call-for-papers
# pages in a row, and records every 2 seconds whether the memory-mapped
# model thrashes: major page faults, disk reads, swapping, CPU time waiting
# for the disk, the kernel's memory and I/O pressure, and how the server's
# memory splits into its own and file-backed. One configuration per job:
#   norepack        weights used straight from the mapped file
#   norepack-mlock  the same, with the model locked in RAM (nothing can be dropped)
#   repack-swap12   weights repacked into the faster layout (14 GiB of the
#                   server's own memory), with a 12 GiB swap file added
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A pinned llama.cpp build (its releases are named bNNNNN).
  LLAMA_CPP_BUILD: b12328

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: norepack
            args: "-c 16384 --no-repack"
            mlock: false
            extra_swap_gb: 0
          - name: norepack-mlock
            args: "-c 16384 --no-repack --mlock"
            mlock: true
            extra_swap_gb: 0
          - name: repack-swap12
            args: "-c 16384 --repack"
            mlock: false
            extra_swap_gb: 12
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          nproc; lscpu | grep -E "Model name" | cut -c1-200
          free -m; swapon --show; df -h / /mnt
      - name: Extra swap
        if: matrix.extra_swap_gb > 0
        run: |
          sudo fallocate -l ${{ matrix.extra_swap_gb }}G /mnt/swap-extra
          sudo chmod 600 /mnt/swap-extra && sudo mkswap -q /mnt/swap-extra && sudo swapon /mnt/swap-extra
          swapon --show; free -m
      - name: Get llama.cpp and the model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$LLAMA_CPP_BUILD" -R ggml-org/llama.cpp --pattern "llama-$LLAMA_CPP_BUILD-bin-ubuntu-x64.tar.gz" -D /tmp/llama
          tar -xzf /tmp/llama/*.tar.gz -C /tmp/llama
          SERVER=$(find /tmp/llama -name llama-server -type f | head -1); chmod +x "$SERVER"
          echo "SERVER=$SERVER" >> "$GITHUB_ENV"
          sudo mkdir -p /mnt/model && sudo chown "$USER" /mnt/model
          t=$(date +%s)
          gh release download model-gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf -R "$GITHUB_REPOSITORY" --pattern '*-of-*.gguf' -D /mnt/model
          echo "download: $(( $(date +%s) - t ))s, $(du -ch /mnt/model/*.gguf | tail -1 | cut -f1)"
          echo "MODEL=$(ls /mnt/model/*-00001-of-*.gguf)" >> "$GITHUB_ENV"
      - name: Probe ${{ matrix.name }}
        run: |
          # Locking 13 GiB needs the locked-memory limit lifted.
          if [ "${{ matrix.mlock }}" = "true" ]; then sudo prlimit --pid $$ --memlock=unlimited:unlimited; ulimit -l; fi
          free -m
          "$SERVER" -m "$MODEL" --device none -ngl 0 -t 4 -np 1 -fa on --cache-ram 0 ${{ matrix.args }} --port 8080 -lv 4 > server.log 2>&1 &
          PID=$!
          python3 .github/scripts/probe_sampler.py $PID > samples.tsv &
          t=$(date +%s); for i in $(seq 1 600); do curl -s -m 2 localhost:8080/health | grep -q ok && break; sleep 1; done
          echo "loaded in $(( $(date +%s) - t ))s"
          grep -a -E "buffer size|mlock|repack" server.log | sed -E 's/^[^:]*: +//' | grep -v "CPU_Mapped" | sort -u
          for page in conferences/SPLASH/OOPSLA/2027/cfp.md conferences/ETAPS/ESOP/2026/cfp.md conferences/LICS/LICS/2026/cfp.md; do
            PAGE="$page" python3 -c "import json,os; md=open(os.environ['PAGE']).read()[:24000]; print(json.dumps({'messages':[{'role':'user','content':'Summarise the important dates of this call for papers in a few sentences.\n\n'+md}],'max_tokens':200,'temperature':0}))" > req.json
            start=$(date +%s.%N)
            curl -s -m 3000 -H 'Content-Type: application/json' -d @req.json localhost:8080/v1/chat/completions > resp.json
            end=$(date +%s.%N)
            echo "=== $page: $(python3 -c "import json;r=json.load(open('resp.json'));t=r['timings'];print(f\"{t['prompt_n']} prompt tokens at {t['prompt_per_second']:.1f}/s, {t['predicted_n']} generated at {t['predicted_per_second']:.1f}/s, {(t['prompt_ms']+t['predicted_ms'])/1000:.0f}s\")")"
            sleep 3
            python3 .github/scripts/probe_sampler.py --summary samples.tsv "$start" "$end"
          done
          kill $PID
          echo "--- whole run ---"
          python3 .github/scripts/probe_sampler.py --summary samples.tsv 0 9999999999
