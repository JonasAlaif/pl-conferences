name: Store a model in a release

# Keeps our own copy of a model file as assets of a release in this
# repository, so that runs depend on GitHub only, not on the model hub
# keeping the file. Release assets have no total-size or bandwidth limit
# but must each be under 2 GiB, so the model is stored in llama.cpp's split
# format (NAME-00001-of-0000N.gguf, ...): llama.cpp loads the first file and
# finds the rest, so nothing has to be joined after downloading. A manifest
# records the source, its checksum and each split's checksum. A second job,
# on a fresh runner, downloads the splits as the scrape workers would,
# verifies them and reports how long it took.
#
# Run once per model; re-running for an existing tag only re-checks it.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Hugging Face repository"
        type: string
        default: "unsloth/gemma-4-26B-A4B-it-qat-GGUF"
      file:
        description: "File in that repository"
        type: string
        default: "gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
      revision:
        description: "Repository revision (commit) to pin; empty = the current main"
        type: string
        default: ""

permissions:
  contents: write

env:
  # One release per model file, named after it.
  TAG: model-${{ inputs.file }}
  # A pinned llama.cpp build (its releases are named bNNNNN; the "latest"
  # release holds no binaries).
  LLAMA_CPP_BUILD: b12328

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Already stored?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; only the check job runs."
            echo "stored=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download from Hugging Face
        if: steps.exists.outputs.stored != 'true'
        env:
          REPO: ${{ inputs.repo }}
          FILE: ${{ inputs.file }}
          REV: ${{ inputs.revision }}
        run: |
          sudo mkdir -p /mnt/model && sudo chown "$USER" /mnt/model && cd /mnt/model
          # Pin the revision so the manifest says exactly what was stored.
          REV=${REV:-$(curl -sSf "https://huggingface.co/api/models/$REPO" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")}
          echo "REV=$REV" >> "$GITHUB_ENV"
          t=$(date +%s)
          curl -sSfL --retry 5 -o "$FILE" "https://huggingface.co/$REPO/resolve/$REV/$FILE"
          echo "downloaded $(du -h "$FILE" | cut -f1) in $(( $(date +%s) - t ))s"
      - name: Get llama.cpp's split tool
        if: steps.exists.outputs.stored != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$LLAMA_CPP_BUILD" -R ggml-org/llama.cpp --pattern "llama-$LLAMA_CPP_BUILD-bin-ubuntu-x64.tar.gz" -D /tmp/llama
          tar -xzf /tmp/llama/*.tar.gz -C /tmp/llama
          SPLIT=$(find /tmp/llama -name llama-gguf-split -type f | head -1); chmod +x "$SPLIT"
          echo "SPLIT=$SPLIT" >> "$GITHUB_ENV"
          echo "LLAMA_CPP=llama.cpp $LLAMA_CPP_BUILD" >> "$GITHUB_ENV"
      - name: Split and write the manifest
        if: steps.exists.outputs.stored != 'true'
        env:
          REPO: ${{ inputs.repo }}
          FILE: ${{ inputs.file }}
        run: |
          cd /mnt/model
          BASE="${FILE%.gguf}"
          # 2000M = 2.0e9 bytes, under the 2 GiB asset limit; a split ends
          # before the tensor that would take it over.
          "$SPLIT" --split --split-max-size 2000M "$FILE" "$BASE" > split.log
          tail -3 split.log
          for f in "$BASE"-*-of-*.gguf; do
            [ "$(stat -c %s "$f")" -lt 2147483648 ] || { echo "::error::$f is 2 GiB or more"; exit 1; }
          done
          orig=$(sha256sum "$FILE" | cut -d' ' -f1)
          {
            echo "source: https://huggingface.co/$REPO/blob/$REV/$FILE"
            echo "file: $FILE"
            echo "bytes: $(stat -c %s "$FILE")"
            echo "sha256: $orig"
            echo "split with llama-gguf-split from $LLAMA_CPP; llama.cpp loads $BASE-00001-of-*.gguf and the others next to it"
            echo "splits:"
            sha256sum "$BASE"-*-of-*.gguf | sed 's/^/  /'
          } > "$BASE.manifest.txt"
          cat "$BASE.manifest.txt"
      - name: Create the release
        if: steps.exists.outputs.stored != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          FILE: ${{ inputs.file }}
        run: |
          cd /mnt/model
          BASE="${FILE%.gguf}"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --latest=false \
            --title "Model: $FILE" \
            --notes "Copy of \`$FILE\` from https://huggingface.co/$REPO (revision $REV), in llama.cpp's split format: point llama.cpp at \`$BASE-00001-of-*.gguf\` with the other splits next to it. Checksums are in the manifest. Used by the scrape workflow so that runs do not depend on the model hub." \
            "$BASE.manifest.txt" "$BASE"-*-of-*.gguf
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name) \(.size)"'

  # On a fresh runner: download the splits as a worker would, verify their
  # checksums, and check that they hold exactly the model they were made
  # from (re-downloaded from the revision the manifest names). Runs for a
  # new release and an existing one alike.
  check:
    needs: store
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download from the release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ inputs.file }}
        run: |
          sudo mkdir -p /mnt/model && sudo chown "$USER" /mnt/model && cd /mnt/model
          BASE="${FILE%.gguf}"
          t=$(date +%s)
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D .
          dl=$(( $(date +%s) - t ))
          size=$(cat "$BASE"-*-of-*.gguf | wc -c)
          echo "download ${dl}s ($(( size / 1048576 / (dl > 0 ? dl : 1) )) MiB/s), $size bytes in $(ls "$BASE"-*-of-*.gguf | wc -l) files"
          sed -n '/^splits:/,$p' "$BASE.manifest.txt" | tail -n +2 | sed 's/^  //' | sha256sum -c --quiet && echo "checksums OK"
          echo "### Model release check" >> "$GITHUB_STEP_SUMMARY"
          echo "Downloaded $(( size / 1048576 )) MiB in ${dl}s, checksums OK." >> "$GITHUB_STEP_SUMMARY"
      - name: Same model as the source
        env:
          FILE: ${{ inputs.file }}
        run: |
          cd /mnt/model
          BASE="${FILE%.gguf}"
          src=$(sed -n 's/^source: //p' "$BASE.manifest.txt" | sed 's|/blob/|/resolve/|')
          curl -sSfL --retry 5 -o "$FILE" "$src"
          [ "$(sha256sum "$FILE" | cut -d' ' -f1)" = "$(sed -n 's/^sha256: //p' "$BASE.manifest.txt")" ] && echo "source file matches the manifest"
          python3 -m venv /tmp/gguf && /tmp/gguf/bin/pip -q install "gguf==0.19.0"
          /tmp/gguf/bin/python "$GITHUB_WORKSPACE/.github/scripts/same_gguf.py" "$FILE" "$BASE"-*-of-*.gguf | tee -a "$GITHUB_STEP_SUMMARY"
