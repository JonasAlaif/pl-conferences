name: DuckDuckGo probe (temporary diagnostic)

# DuckDuckGo serves curl and challenges reqwest. Before moving the search
# requests to curl: do the fallback engines answer curl too, and with which
# User-Agent do their result pages keep the markup the parsers expect?
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ua: [honest, chrome]
        replica: [1, 2]
    steps:
      - name: Ask
        env:
          WHICH: ${{ matrix.ua }}
        run: |
          UA="pl-conferences/1.0 (+https://github.com/${{ github.repository }})"
          [ "$WHICH" = chrome ] && UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36"
          ask() { # engine url marker
            s=$(curl -s --compressed -L --max-time 40 -o r.html -w '%{http_code}' -A "$UA" -H "Accept: text/html" -H "Accept-Language: en-US,en;q=0.9" "$2")
            echo "== $WHICH | $1 | http=$s bytes=$(wc -c < r.html) results=$(grep -o "$3" r.html | wc -l)"
            sleep 8
          }
          for q in "POPL+2027+student+volunteers" "CAV+2027+call+for+papers" "LICS+2027+call+for+papers"; do
            ask ddg "https://html.duckduckgo.com/html/?q=$q" 'class="result__a"'
            ask brave "https://search.brave.com/search?q=$q&source=web" 'class="snippet '
            ask bing "https://www.bing.com/search?q=$q" 'class="b_algo"'
          done
