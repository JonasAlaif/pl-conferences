name: DuckDuckGo probe (temporary diagnostic)

# Production (reqwest) gets DuckDuckGo's challenge page on every search while
# curl from the same kind of runner is served. This runs both on one runner,
# varying one property of the client at a time, to find which one matters.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the probe
        run: cd probe && cargo build --release 2>&1 | tail -2
      - name: curl control, before
        run: |
          s=$(curl -s --compressed -o r.html -w '%{http_code} http/%{http_version}' -A "pl-conferences/1.0 (+https://github.com/${{ github.repository }})" -H "Accept: text/html" -H "Accept-Language: en-US,en;q=0.9" "https://html.duckduckgo.com/html/?q=ICFP+2027+call+for+papers")
          echo "== curl honest-ua | $s bytes=$(wc -c < r.html) results=$(grep -o 'result__a' r.html | wc -l) challenge=$(grep -c 'bots use DuckDuckGo' r.html)"
          curl --version | head -1
      - name: reqwest variants
        run: sleep 6; ./probe/target/release/ddg-probe
      - name: curl control, after
        run: |
          sleep 6
          s=$(curl -s --compressed -o r.html -w '%{http_code} http/%{http_version}' -A "pl-conferences/1.0 (+https://github.com/${{ github.repository }})" -H "Accept: text/html" -H "Accept-Language: en-US,en;q=0.9" "https://html.duckduckgo.com/html/?q=PLDI+2027+call+for+papers")
          echo "== curl honest-ua | $s bytes=$(wc -c < r.html) results=$(grep -o 'result__a' r.html | wc -l) challenge=$(grep -c 'bots use DuckDuckGo' r.html)"
