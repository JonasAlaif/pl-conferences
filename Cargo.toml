[package]
name = "pl-conferences"
version = "0.1.0"
edition = "2024"
description = "Collects the important dates for PL conferences with a small local LLM"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
env_logger = "0.11.11"
htmd = "0.5.5"
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "gzip", "brotli", "json"] }
schemars = { version = "1.2.2", features = ["preserve_order"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
url = "2.5.8"
urlencoding = "2.1.3"

[profile.release]
opt-level = 2
