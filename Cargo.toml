[package]
name = "pl-conferences"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.40", features = ["serde"] }
duckduckgo = "0.1.2"
html2md = "0.2.15"
modelfile = "0.3.0"
ollama-rs = { git = "https://github.com/pepperoni21/ollama-rs", features = ["tool-implementations", "modelfile", "stream"] }
regex = "1.11.1"
reqwest = "0.12.15"
schemars = { version = "0.8.22", features = ["chrono"] }
serde = "1.0.219"
serde_json = "1.0.140"
tokio = "1.44.1"
tokio-stream = "0.1.17"
